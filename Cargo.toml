[package]
name = "handel-options"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = "=5.30.1"

[dev-dependencies]
near-sdk = { version = "=5.30.1", features = ["unit-testing"] }

[features]
default = []
fault-injection = []

[workspace]
members = [".", "contracts/escrow", "contracts/mock-ft"]
resolver = "2"
