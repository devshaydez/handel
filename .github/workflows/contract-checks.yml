name: Handel backend checks

on:
  push:
    branches:
      - work/testnet-backend-hardening
  pull_request:
    branches:
      - main
      - feat/handel-archive-core
      - work/testnet-backend-hardening
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    name: Rust format, unit tests, and Wasm build
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: rustfmt

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run contract unit tests
        run: cargo test --lib

      - name: Build contract Wasm
        run: cargo build --target wasm32-unknown-unknown --release

  sdk:
    name: TypeScript SDK build and offline demo
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdk
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install SDK dependencies
        run: npm install --no-audit --no-fund

      - name: Build SDK
        run: npm run build

      - name: Run SDK unit tests
        run: npm test

      - name: Run offline lifecycle demo
        run: npm run lifecycle
